[project]
name = "vectapilot-api"
version = "0.1.0"
description = "VectaPilot API — FastAPI service for the AI support copilot"
authors = [
    { name = "shesha", email = "sheshasaigoud@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    # Exact pin (ADR 0006): the newest release at least 7 days old on install day (2026-10-14).
    "anthropic==1.12.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vectapilot-api = "vectapilot_api.main:run"
# The M1 measurement CLI: a dry run unless `--live` (shesha only; agents never pass it).
vectapilot-llm = "vectapilot_api.llm_cli:main"
# After `alembic upgrade head`: the app role's login and password (ADR 0009).
vectapilot-db-provision = "vectapilot_api.db_provision:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    # Tests import `httpx2.MockTransport` (ADR 0006). The major version `anthropic` itself allows
    # (`httpx2>=2,<3`); uv.lock pins the exact version it resolves.
    "httpx2>=2.13.1,<3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, async pitfalls, ruff-specific, bandit
# (security), banned imports (TID251, below)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S", "TID251"]

# ADR 0006, One entry point: only the adapter imports the SDK, so SDK types and exceptions (an SDK
# request holds the key header) never leave it. Banning `anthropic` also bans every submodule
# (`from anthropic.types import …`); tests/gateway/test_anthropic_provider.py proves it.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"anthropic".msg = "only gateway/providers/anthropic.py may import the Anthropic SDK (ADR 0006)"
# The same SDK objects, re-exported by the adapter's own imports.
"vectapilot_api.gateway.providers.anthropic.anthropic".msg = "the Anthropic SDK stays in the adapter (ADR 0006)"
"vectapilot_api.gateway.providers.anthropic.Message".msg = "the Anthropic SDK stays in the adapter (ADR 0006)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # `assert` is how pytest works
"src/vectapilot_api/gateway/providers/anthropic.py" = ["TID251"] # the one allowed importer

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real Postgres and Redis (set RUN_INTEGRATION=1)"]
# An xfail test that unexpectedly passes is reported as a failure (see tests/test_readyz.py).
xfail_strict = true
filterwarnings = ["error"]

# Coverage gate for gateway/ (ADR 0006): `make coverage` runs scripts/coverage_gate.py, which holds
# the thresholds. tests/test_coverage_gate.py pins these settings, so change both together.
[tool.coverage.run]
branch = true # measure both ways of every `if`/loop, not only the lines
# Measure the whole package, so a module that no test imports shows up at 0 % instead of missing.
source_pkgs = ["vectapilot_api"]

[tool.coverage.report]
precision = 2
# Also count a directory without __init__.py (Python still imports it, as a namespace package).
include_namespace_packages = true
