[project]
name = "vectapilot-api"
version = "0.1.0"
description = "VectaPilot API — FastAPI service for the AI support copilot"
authors = [
    { name = "shesha", email = "sheshasaigoud@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vectapilot-api = "vectapilot_api.main:run"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify, async pitfalls, ruff-specific, bandit (security)
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # `assert` is how pytest works

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real Postgres and Redis (set RUN_INTEGRATION=1)"]
# An xfail test that unexpectedly passes is reported as a failure (see tests/test_readyz.py).
xfail_strict = true
filterwarnings = [
    "error",
    # Starlette 1.x prefers `httpx2` for TestClient; the human decided to stay on `httpx` for now
    # (2026-10-12, see CLAUDE.md, Known issues), so this one deprecation warning is ignored.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

# Coverage gate for gateway/ (ADR 0006): `make coverage` runs scripts/coverage_gate.py, which holds
# the thresholds. tests/test_coverage_gate.py pins these settings, so change both together.
[tool.coverage.run]
branch = true # measure both ways of every `if`/loop, not only the lines
# Measure the whole package, so a module that no test imports shows up at 0 % instead of missing.
source_pkgs = ["vectapilot_api"]

[tool.coverage.report]
precision = 2
# Also count a directory without __init__.py (Python still imports it, as a namespace package).
include_namespace_packages = true
