# Lint, type-check and test every pull request and every push to main.
# Branch protection on main requires both jobs to pass before a PR can merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the now-outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    # Real Postgres (with pgvector) and Redis for the integration tests.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: vectapilot
          POSTGRES_PASSWORD: vectapilot-ci # throwaway database that lives only inside this job
          POSTGRES_DB: vectapilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vectapilot"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # alembic runs as ci; pytest's conftest pins test + fake before importing the app (ADR 0006)
      VECTAPILOT_ENVIRONMENT: ci
      VECTAPILOT_DATABASE_URL: postgresql+asyncpg://vectapilot:vectapilot-ci@localhost:5432/vectapilot
      VECTAPILOT_REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7

      # Pinned to a commit SHA: setup-uv publishes no floating major tag (like `v10`) after v7,
      # and a SHA cannot be re-pointed to different code (supply-chain safety).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.24" # same as local development
          working-directory: apps/api
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - name: Apply database migrations
        run: uv run alembic upgrade head
      - run: uv run pytest

  api-image:
    name: api image (docker build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Builds the same image `make up` uses, so a broken Dockerfile fails the PR, not a deploy.
      - run: docker build --tag vectapilot-api:ci apps/api
      # `create_app` loads gateway/models.toml at startup, so this also proves the catalog ships
      # inside the image (the wheel installed by `uv sync --no-editable`).
      - name: Container starts (catalog loads) and /healthz answers
        run: |
          docker run --detach --name api --publish 127.0.0.1:8000:8000 \
            --env VECTAPILOT_DATABASE_URL=postgresql+asyncpg://u:p@127.0.0.1:1/db \
            --env VECTAPILOT_REDIS_URL=redis://127.0.0.1:1/0 \
            vectapilot-api:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          docker logs api
          exit 1

  web:
    name: web (lint, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
