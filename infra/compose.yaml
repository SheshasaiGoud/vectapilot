# Local development stack: Postgres (+ pgvector), Redis, a one-off migration job, and the API.
# Start it from the repository root with `make up`.
#
# Ports are published on 127.0.0.1 only, so nothing here is reachable from other devices on
# your network. The default passwords are for this local stack only; override them in infra/.env.
#
# Two database roles (ADR 0009): `vectapilot` owns the schema and runs migrations; the API logs in
# as `vectapilot_app` (no superuser, no BYPASSRLS, owns nothing). Migration 0002 creates that role
# without a password; `vectapilot-db-provision` then sets it from the API's URL below.
name: vectapilot

x-app-database-url: &app-database-url postgresql+asyncpg://vectapilot_app:${VECTAPILOT_APP_DB_PASSWORD:-vectapilot-app-dev}@postgres:5432/vectapilot

x-api-environment: &api-environment
  VECTAPILOT_ENVIRONMENT: local
  VECTAPILOT_DATABASE_URL: *app-database-url
  VECTAPILOT_REDIS_URL: redis://redis:6379/0
  VECTAPILOT_LOG_LEVEL: ${VECTAPILOT_LOG_LEVEL:-INFO}
  # M5 (ADR 0016 decision 1): the per-business tool configurations and sandbox seeds, mounted
  # read-only below. The API validates the whole folder at startup.
  VECTAPILOT_TOOLS_CONFIG_DIR: /app/data/sandbox
  # M5 PR 4 (W11): the corpus folder, mounted read-only below. Required with the tools folder:
  # startup refuses a business whose tools.json and corpus manifest name different business
  # types. Only each manifest's business_type is read, never a document.
  VECTAPILOT_CORPUS_DIR: /app/data/sample

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: vectapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vectapilot-dev}
      POSTGRES_DB: vectapilot
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      # Postgres 18 keeps its data under /var/lib/postgresql/18/docker; mount the parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectapilot -d vectapilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies database migrations as the owner, gives the app role its login, then exits. The API
  # only starts if this succeeds. Only this job holds the owner's URL; the API never gets it.
  migrate:
    # Reuses the image built by the `api` service; building it here too would race.
    image: vectapilot-api:dev
    pull_policy: never
    command: ["sh", "-c", "alembic upgrade head && vectapilot-db-provision"]
    environment:
      VECTAPILOT_MIGRATION_DATABASE_URL: postgresql+asyncpg://vectapilot:${POSTGRES_PASSWORD:-vectapilot-dev}@postgres:5432/vectapilot
      VECTAPILOT_DATABASE_URL: *app-database-url
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: vectapilot-api:dev
    build: ../apps/api
    environment: *api-environment
    ports: ["127.0.0.1:8000:8000"]
    # Read-only: the API can read the synthetic sandbox configuration but never change it. A bind
    # mount, not a copy into the image. Takes effect at the next `make up` (image rebuild plus
    # recreate; volumes kept). The image bakes migrations/, so until it is rebuilt with 0006, do
    # not run `docker compose up` or `make migrate`: the old image's migrate job cannot find
    # revision 0006 and the API would never start. `docker compose restart api` is safe (it does
    # not re-run migrate).
    volumes:
      - ../data/sandbox:/app/data/sandbox:ro
      - ../data/sample:/app/data/sample:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
